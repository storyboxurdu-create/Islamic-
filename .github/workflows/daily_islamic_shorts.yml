name: Daily Islamic Shorts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg, fonts, and Python dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra fontconfig
          fc-cache -f -v > /dev/null
          fc-list :lang=ur file
          pip install --upgrade pip
          pip install pillow arabic-reshaper python-bidi edge-tts requests google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Generate Islamic quiz reel
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python islamic_reel.py

      - name: Upload to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python upload_islamic_youtube.py

      - name: Commit updated islamic_history.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add islamic_history.json
          git diff --staged --quiet || git commit -m "Update islamic_history.json [skip ci]"
          git push
