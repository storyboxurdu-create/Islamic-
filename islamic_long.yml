name: Long Islamic Video

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-long-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
          pip install edge-tts google-api-python-client google-auth-oauthlib

      - name: Generate complete 3+ minute Islamic story video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          EDGE_TTS_VOICE: ${{ secrets.EDGE_TTS_VOICE }}
        run: python islamic_long.py

      - name: Commit updated long story history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add islamic_long_history.json || true
          git diff --staged --quiet || git commit -m "Update long story history"
          git push || true
